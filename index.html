<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anuario Digital</title>
  <script src="https://cdn.jsdelivr.net/npm/page-flip/dist/js/page-flip.browser.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #121212;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: system-ui, -apple-system, sans-serif;
      overflow-x: hidden;
    }
    .flip-container {
      width: 100%;
      max-width: 1200px;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px 10px;
    }
    #book {
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
    }
    .page {
      background-color: #ffffff;
      overflow: hidden;
    }
    .page img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      user-select: none;
    }
    .controls {
      display: flex;
      gap: 16px;
      margin-top: 15px;
      margin-bottom: 25px;
      align-items: center;
    }
    .btn {
      background-color: #ffffff18;
      color: #ffffff;
      border: 1px solid #ffffff35;
      padding: 10px 20px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      transition: all 0.2s ease;
    }
    .btn:hover {
      background-color: #ffffff35;
      transform: translateY(-1px);
    }
    .btn:active {
      transform: translateY(0);
    }
    .page-info {
      color: #cccccc;
      font-size: 15px;
      min-width: 130px;
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="flip-container">
    <div id="book"></div>
  </div>

  <div class="controls">
    <button class="btn" id="prevBtn">← Anterior</button>
    <span class="page-info" id="pageNumber">Portada</span>
    <button class="btn" id="nextBtn">Siguiente →</button>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const bookElement = document.getElementById('book');
      
      // Lista con los nombres exactos de tus 34 archivos
      const imageFiles = [
        'Page_0.jpg',
        ...Array.from({ length: 33 }, (_, i) => `Page_${String(i + 1).padStart(2, '0')}.jpg`)
      ];

      const TOTAL_PAGES = imageFiles.length;

      // Crear cada página en el libro
      imageFiles.forEach((file, index) => {
        const pageDiv = document.createElement('div');
        pageDiv.className = 'page';

        const img = document.createElement('img');
        img.src = file; // Ruta directa en la misma carpeta
        img.alt = `Página ${index + 1}`;
        
        if (index > 3) {
          img.loading = 'lazy';
        }

        pageDiv.appendChild(img);
        bookElement.appendChild(pageDiv);
      });

      // Inicialización de PageFlip
      const pageFlip = new St.PageFlip(bookElement, {
        width: 550,
        height: 733,
        size: 'stretch',
        minWidth: 315,
        maxWidth: 1000,
        minHeight: 420,
        maxHeight: 1350,
        maxShadowOpacity: 0.5,
        showCover: true,
        mobileScrollSupport: false
      });

      pageFlip.loadFromHTML(document.querySelectorAll('.page'));

      const prevBtn = document.getElementById('prevBtn');
      const nextBtn = document.getElementById('nextBtn');
      const pageInfo = document.getElementById('pageNumber');

      prevBtn.addEventListener('click', () => pageFlip.flipPrev());
      nextBtn.addEventListener('click', () => pageFlip.flipNext());

      pageFlip.on('flip', (e) => {
        const current = e.data;
        if (current === 0) {
          pageInfo.textContent = 'Portada';
        } else if (current >= TOTAL_PAGES - 1) {
          pageInfo.textContent = 'Contraportada';
        } else {
          pageInfo.textContent = `Páginas ${current} - ${current + 1} de ${TOTAL_PAGES}`;
        }
      });
    });
  </script>
</body>
</html>
