<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anuario Digital 4° Medio C</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #121212;
      background-image: radial-gradient(circle at 50% 40%, #1f1f1f 0%, #0a0a0a 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: system-ui, -apple-system, sans-serif;
      overflow: hidden;
      user-select: none;
    }

    /* Escenario principal */
    .viewport {
      width: 100%;
      height: calc(100vh - 80px);
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      position: relative;
    }

    #zoomContainer {
      transform-origin: center center;
      transition: transform 0.2s ease-out;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    #zoomContainer.zoomed {
      cursor: grab;
    }
    #zoomContainer.zoomed:active {
      cursor: grabbing;
    }

    /* Contenedor del pliego abierto (2 páginas A4 juntas) */
    .book-scene {
      /* Altura adaptable a la pantalla manteniendo proporción exacta de 2 A4 juntas (2 : 1.4142) */
      height: min(82vh, 62vw);
      aspect-ratio: 2 / 1.4142;
      position: relative;
      perspective: 2500px;
      transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* Centrar cuando está cerrado en portada o contraportada */
    .book-scene.closed-front {
      transform: translateX(-25%);
    }
    .book-scene.closed-back {
      transform: translateX(25%);
    }

    /* Sombra y canto de hojas cuando el libro está abierto */
    .book-spine-shadow {
      position: absolute;
      inset: 0;
      border-radius: 3px;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.4s ease;
      box-shadow: 
        0 25px 50px rgba(0, 0, 0, 0.75),
        -5px 0 0 -1px #e5e5e5,
        -6px 0 0 -1px #888888,
        -10px 0 15px rgba(0, 0, 0, 0.45),
        5px 0 0 -1px #e5e5e5,
        6px 0 0 -1px #888888,
        10px 0 15px rgba(0, 0, 0, 0.45);
    }
    .book-scene.is-open .book-spine-shadow {
      opacity: 1;
    }

    /* Cada hoja física (ocupa la mitad derecha y rota hacia la mitad izquierda) */
    .sheet {
      position: absolute;
      top: 0;
      left: 50%;
      width: 50%;
      height: 100%;
      transform-origin: left center;
      transform-style: preserve-3d;
      transition: transform 0.7s cubic-bezier(0.4, 0, 0.2, 1);
      cursor: pointer;
    }

    .sheet.flipped {
      transform: rotateY(-180deg);
    }

    /* Caras de cada hoja */
    .face {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      background-color: #ffffff;
      -webkit-backface-visibility: hidden;
      backface-visibility: hidden;
      overflow: hidden;
      border-radius: 0 2px 2px 0;
      box-shadow: 0 10px 25px rgba(0,0,0,0.35);
    }

    .face.back {
      transform: rotateY(180deg);
      border-radius: 2px 0 0 2px;
    }

    .face img {
      width: 100%;
      height: 100%;
      object-fit: fill;
      display: block;
      pointer-events: none;
      -webkit-user-drag: none;
    }

    /* Sombra del pliegue central (unión de las dos páginas) */
    .face.front::after {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 34px;
      height: 100%;
      background: linear-gradient(to right, rgba(0,0,0,0.26) 0%, rgba(0,0,0,0.06) 55%, transparent 100%);
      pointer-events: none;
    }

    .face.back::after {
      content: "";
      position: absolute;
      top: 0;
      right: 0;
      width: 34px;
      height: 100%;
      background: linear-gradient(to left, rgba(0,0,0,0.26) 0%, rgba(0,0,0,0.06) 55%, transparent 100%);
      pointer-events: none;
    }

    /* Quitar sombra central en portada y contraportada */
    .sheet:first-of-type .face.front::after,
    .sheet:last-of-type .face.back::after {
      display: none;
    }

    /* Barra de controles inferior */
    .controls {
      height: 65px;
      display: flex;
      gap: 12px;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 0 15px;
    }

    .btn-group {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .btn {
      background-color: #ffffff18;
      color: #ffffff;
      border: 1px solid #ffffff35;
      padding: 8px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      backdrop-filter: blur(8px);
      transition: all 0.2s ease;
    }
    .btn:hover {
      background-color: #ffffff35;
    }
    .btn-icon {
      padding: 8px 13px;
      font-size: 15px;
    }

    .page-info {
      color: #e0e0e0;
      font-size: 14px;
      min-width: 145px;
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="viewport">
    <div id="zoomContainer">
      <div class="book-scene closed-front" id="bookScene">
        <div class="book-spine-shadow"></div>
        <!-- Las hojas se generan aquí -->
      </div>
    </div>
  </div>

  <div class="controls">
    <div class="btn-group">
      <button class="btn" id="prevBtn">← Anterior</button>
      <span class="page-info" id="pageNumber">Portada</span>
      <button class="btn" id="nextBtn">Siguiente →</button>
    </div>

    <div class="btn-group">
      <button class="btn btn-icon" id="zoomOutBtn" title="Alejar">−</button>
      <button class="btn btn-icon" id="zoomResetBtn" title="Restablecer">100%</button>
      <button class="btn btn-icon" id="zoomInBtn" title="Acercar">+</button>
    </div>

    <button class="btn" id="fullscreenBtn">⛶ Pantalla completa</button>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const bookScene = document.getElementById('bookScene');
      const zoomContainer = document.getElementById('zoomContainer');
      const pageInfo = document.getElementById('pageNumber');

      // Tus 36 imágenes en orden exacto
      const imageFiles = [
        'Page_0.jpg',
        'Page_0,5.jpg',
        ...Array.from({ length: 32 }, (_, i) => `Page_${String(i + 1).padStart(2, '0')}.jpg`),
        'Page_32,5.jpg',
        'Page_33.jpg'
      ];

      const TOTAL_PAGES = imageFiles.length; // 36 páginas
      const TOTAL_SHEETS = TOTAL_PAGES / 2;  // 18 hojas de papel (frente y dorso)
      const sheets = [];

      // Crear las 18 hojas con frente y dorso
      for (let i = 0; i < TOTAL_SHEETS; i++) {
        const sheet = document.createElement('div');
        sheet.className = 'sheet';

        const front = document.createElement('div');
        front.className = 'face front';
        const imgFront = document.createElement('img');
        imgFront.src = imageFiles[i * 2];
        imgFront.decoding = 'async';
        front.appendChild(imgFront);

        const back = document.createElement('div');
        back.className = 'face back';
        const imgBack = document.createElement('img');
        imgBack.src = imageFiles[i * 2 + 1];
        imgBack.decoding = 'async';
        back.appendChild(imgBack);

        sheet.appendChild(front);
        sheet.appendChild(back);

        // Hacer clic en la hoja derecha avanza, en la izquierda retrocede
        sheet.addEventListener('click', () => {
          if (sheet.classList.contains('flipped')) {
            goPrev();
          } else {
            goNext();
          }
        });

        bookScene.appendChild(sheet);
        sheets.push(sheet);
      }

      let currentSheet = 0; // 0 = Portada cerrada, 1..17 = Abierto, 18 = Contraportada

      function updateBookState() {
        // Actualizar orden de capas (z-index) para que nunca se crucen ni se vean hojas de abajo
        sheets.forEach((sheet, index) => {
          if (index < currentSheet) {
            sheet.classList.add('flipped');
            sheet.style.zIndex = index + 1;
          } else {
            sheet.classList.remove('flipped');
            sheet.style.zIndex = TOTAL_SHEETS - index;
          }
        });

        // Actualizar posición del libro y texto
        if (currentSheet === 0) {
          bookScene.className = 'book-scene closed-front';
          pageInfo.textContent = 'Portada';
        } else if (currentSheet === TOTAL_SHEETS) {
          bookScene.className = 'book-scene closed-back';
          pageInfo.textContent = 'Contraportada';
        } else {
          bookScene.className = 'book-scene is-open';
          const leftPage = currentSheet * 2;
          const rightPage = leftPage + 1;
          pageInfo.textContent = `Páginas ${leftPage} - ${rightPage} de ${TOTAL_PAGES}`;
        }
      }

      function goNext() {
        if (currentSheet < TOTAL_SHEETS) {
          // Elevar temporalmente la hoja que está girando por encima de todas
          const turningSheet = sheets[currentSheet];
          turningSheet.style.zIndex = 50;
          currentSheet++;
          updateBookState();
          turningSheet.style.zIndex = 50;
          setTimeout(() => updateBookState(), 700);
        }
      }

      function goPrev() {
        if (currentSheet > 0) {
          currentSheet--;
          const turningSheet = sheets[currentSheet];
          updateBookState();
          turningSheet.style.zIndex = 50;
          setTimeout(() => updateBookState(), 700);
        }
      }

      updateBookState();

      // Botones y teclado
      document.getElementById('prevBtn').addEventListener('click', goPrev);
      document.getElementById('nextBtn').addEventListener('click', goNext);

      window.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowRight') goNext();
        if (e.key === 'ArrowLeft') goPrev();
      });

      // Zoom y arrastre (Pan)
      let zoom = 1, panX = 0, panY = 0, isDragging = false, startX = 0, startY = 0;
      const zoomResetBtn = document.getElementById('zoomResetBtn');

      function applyZoom() {
        if (zoom <= 1) {
          zoom = 1; panX = 0; panY = 0;
          zoomContainer.classList.remove('zoomed');
        } else {
          zoomContainer.classList.add('zoomed');
        }
        zoomContainer.style.transform = `translate(${panX}px, ${panY}px) scale(${zoom})`;
        zoomResetBtn.textContent = `${Math.round(zoom * 100)}%`;
      }

      document.getElementById('zoomInBtn').addEventListener('click', () => {
        if (zoom < 2.5) { zoom = +(zoom + 0.25).toFixed(2); applyZoom(); }
      });
      document.getElementById('zoomOutBtn').addEventListener('click', () => {
        if (zoom > 1) { zoom = +(zoom - 0.25).toFixed(2); applyZoom(); }
      });
      zoomResetBtn.addEventListener('click', () => {
        zoom = 1; applyZoom();
      });

      zoomContainer.addEventListener('mousedown', (e) => {
        if (zoom <= 1) return;
        isDragging = true;
        startX = e.clientX - panX;
        startY = e.clientY - panY;
        zoomContainer.style.transition = 'none';
      });
      window.addEventListener('mousemove', (e) => {
        if (!isDragging) return;
        panX = e.clientX - startX;
        panY = e.clientY - startY;
        zoomContainer.style.transform = `translate(${panX}px, ${panY}px) scale(${zoom})`;
      });
      window.addEventListener('mouseup', () => {
        if (isDragging) {
          isDragging = false;
          zoomContainer.style.transition = 'transform 0.2s ease-out';
        }
      });

      // Pantalla completa
      const fullscreenBtn = document.getElementById('fullscreenBtn');
      fullscreenBtn.addEventListener('click', () => {
        if (!document.fullscreenElement) {
          document.documentElement.requestFullscreen();
        } else {
          document.exitFullscreen();
        }
      });
      document.addEventListener('fullscreenchange', () => {
        fullscreenBtn.textContent = document.fullscreenElement ? '✕ Salir' : '⛶ Pantalla completa';
      });
    });
  </script>
</body>
</html>
