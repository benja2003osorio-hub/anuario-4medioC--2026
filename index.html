<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anuario Digital</title>
  <script src="https://cdn.jsdelivr.net/npm/page-flip/dist/js/page-flip.browser.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #121212;
      background-image: radial-gradient(circle at 50% 40%, #1c1c1c 0%, #0d0d0d 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: system-ui, -apple-system, sans-serif;
      overflow-x: hidden;
      user-select: none;
    }

    .flip-container {
      width: 100%;
      max-width: 1400px;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px 15px;
      position: relative;
      overflow: hidden;
    }

    /* Envoltura para zoom interactivo */
    #zoomWrapper {
      transform-origin: center center;
      transition: transform 0.2s cubic-bezier(0.25, 1, 0.5, 1);
      display: flex;
      justify-content: center;
      align-items: center;
    }
    #zoomWrapper.zoomed {
      cursor: grab;
    }
    #zoomWrapper.zoomed:active {
      cursor: grabbing;
    }

    #book {
      position: relative;
      border-radius: 2px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.55);
      transition: box-shadow 0.3s ease;
    }

    /* Volumen lateral y canto de páginas cuando el libro está abierto */
    #book.is-open {
      box-shadow: 
        0 25px 50px rgba(0, 0, 0, 0.75),
        -6px 0 0 -2px #e5e5e5,
        -7px 0 0 -2px #999999,
        -12px 2px 10px rgba(0, 0, 0, 0.4),
        6px 0 0 -2px #e5e5e5,
        7px 0 0 -2px #999999,
        12px 2px 10px rgba(0, 0, 0, 0.4);
    }

    /* Cada página individual */
    .page {
      background-color: #ffffff;
      overflow: hidden;
      position: relative;
    }

    .page img {
      width: 100%;
      height: 100%;
      object-fit: fill;
      display: block;
      user-select: none;
      pointer-events: none;
    }

    /* Sombra del pliegue / lomo central en páginas interiores */
    .page.--left:not(:first-child):not(:last-child)::after {
      content: "";
      position: absolute;
      top: 0;
      right: 0;
      width: 32px;
      height: 100%;
      background: linear-gradient(to left, rgba(0, 0, 0, 0.25) 0%, rgba(0, 0, 0, 0.05) 60%, transparent 100%);
      pointer-events: none;
      z-index: 5;
    }

    .page.--right:not(:first-child):not(:last-child)::after {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 32px;
      height: 100%;
      background: linear-gradient(to right, rgba(0, 0, 0, 0.25) 0%, rgba(0, 0, 0, 0.05) 60%, transparent 100%);
      pointer-events: none;
      z-index: 5;
    }

    /* Controles */
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 15px;
      margin-bottom: 20px;
      align-items: center;
      justify-content: center;
      z-index: 10;
    }

    .btn-group {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .btn {
      background-color: #ffffff18;
      color: #ffffff;
      border: 1px solid #ffffff35;
      padding: 9px 18px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      backdrop-filter: blur(8px);
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .btn:hover {
      background-color: #ffffff35;
      transform: translateY(-1px);
    }
    .btn:active {
      transform: translateY(0);
    }
    .btn-icon {
      padding: 9px 14px;
      font-size: 16px;
    }

    .page-info {
      color: #cccccc;
      font-size: 15px;
      min-width: 140px;
      text-align: center;
      letter-spacing: 0.3px;
    }
  </style>
</head>
<body>

  <div class="flip-container">
    <div id="zoomWrapper">
      <div id="book"></div>
    </div>
  </div>

  <div class="controls">
    <div class="btn-group">
      <button class="btn" id="prevBtn" title="Flecha izquierda (←)">← Anterior</button>
      <span class="page-info" id="pageNumber">Portada</span>
      <button class="btn" id="nextBtn" title="Flecha derecha (→)">Siguiente →</button>
    </div>

    <div class="btn-group">
      <button class="btn btn-icon" id="zoomOutBtn" title="Alejar zoom">−</button>
      <button class="btn btn-icon" id="zoomResetBtn" title="Restablecer zoom">100%</button>
      <button class="btn btn-icon" id="zoomInBtn" title="Acercar zoom">+</button>
    </div>

    <button class="btn" id="fullscreenBtn">⛶ Pantalla completa</button>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const bookElement = document.getElementById('book');
      const zoomWrapper = document.getElementById('zoomWrapper');
      
      const imageFiles = [
        'Page_0.jpg',
        'Page_0,5.jpg',
        ...Array.from({ length: 32 }, (_, i) => `Page_${String(i + 1).padStart(2, '0')}.jpg`),
        'Page_32,5.jpg',
        'Page_33.jpg'
      ];

      const TOTAL_PAGES = imageFiles.length;

      // Generar páginas con tapas duras en extremos
      imageFiles.forEach((file, index) => {
        const pageDiv = document.createElement('div');
        pageDiv.className = 'page';

        // Tapa dura para la portada y contraportada
        if (index === 0 || index === TOTAL_PAGES - 1) {
          pageDiv.setAttribute('data-density', 'hard');
        } else {
          pageDiv.setAttribute('data-density', 'soft');
        }

        const img = document.createElement('img');
        img.src = file;
        img.alt = `Página ${index + 1}`;
        pageDiv.appendChild(img);

        bookElement.appendChild(pageDiv);
      });

      // Configuración estricta para pliego doble (dos páginas enfrentadas)
      const pageFlip = new St.PageFlip(bookElement, {
        width: 500,           // Proporción A4 exacta
        height: 707,
        size: 'stretch',
        minWidth: 320,
        maxWidth: 1200,
        minHeight: 450,
        maxHeight: 1697,
        maxShadowOpacity: 0.5,
        showCover: true,      // Portada y contraportada solas
        usePortrait: false,   // OBLIGA a mantener SIEMPRE dos páginas enfrentadas en el interior
        drawShadow: true,
        flippingTime: 650,
        mobileScrollSupport: false
      });

      pageFlip.loadFromHTML(document.querySelectorAll('.page'));

      const prevBtn = document.getElementById('prevBtn');
      const nextBtn = document.getElementById('nextBtn');
      const pageInfo = document.getElementById('pageNumber');
      const fullscreenBtn = document.getElementById('fullscreenBtn');

      prevBtn.addEventListener('click', () => pageFlip.flipPrev());
      nextBtn.addEventListener('click', () => pageFlip.flipNext());

      pageFlip.on('flip', (e) => {
        const current = e.data;
        if (current === 0) {
          pageInfo.textContent = 'Portada';
          bookElement.classList.remove('is-open');
        } else if (current >= TOTAL_PAGES - 1) {
          pageInfo.textContent = 'Contraportada';
          bookElement.classList.remove('is-open');
        } else {
          pageInfo.textContent = `Páginas ${current} - ${current + 1} de ${TOTAL_PAGES}`;
          bookElement.classList.add('is-open');
        }
      });

      // 1. Navegación por teclado (Flechas)
      window.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowRight') pageFlip.flipNext();
        if (e.key === 'ArrowLeft') pageFlip.flipPrev();
      });

      // 2. Control de Zoom y Pan (Arrastre)
      let currentZoom = 1;
      let panX = 0;
      let panY = 0;
      let isDragging = false;
      let startX = 0;
      let startY = 0;

      const updateTransform = () => {
        zoomWrapper.style.transform = `translate(${panX}px, ${panY}px) scale(${currentZoom})`;
        document.getElementById('zoomResetBtn').textContent = `${Math.round(currentZoom * 100)}%`;
        if (currentZoom > 1) {
          zoomWrapper.classList.add('zoomed');
        } else {
          zoomWrapper.classList.remove('zoomed');
          panX = 0;
          panY = 0;
          zoomWrapper.style.transform = `translate(0px, 0px) scale(1)`;
        }
      };

      document.getElementById('zoomInBtn').addEventListener('click', () => {
        if (currentZoom < 2.2) {
          currentZoom = Math.min(2.2, +(currentZoom + 0.2).toFixed(2));
          updateTransform();
        }
      });

      document.getElementById('zoomOutBtn').addEventListener('click', () => {
        if (currentZoom > 0.8) {
          currentZoom = Math.max(0.8, +(currentZoom - 0.2).toFixed(2));
          updateTransform();
        }
      });

      document.getElementById('zoomResetBtn').addEventListener('click', () => {
        currentZoom = 1;
        panX = 0;
        panY = 0;
        updateTransform();
      });

      zoomWrapper.addEventListener('mousedown', (e) => {
        if (currentZoom <= 1) return;
        isDragging = true;
        startX = e.clientX - panX;
        startY = e.clientY - panY;
        zoomWrapper.style.transition = 'none';
      });

      window.addEventListener('mousemove', (e) => {
        if (!isDragging) return;
        panX = e.clientX - startX;
        panY = e.clientY - startY;
        zoomWrapper.style.transform = `translate(${panX}px, ${panY}px) scale(${currentZoom})`;
      });

      window.addEventListener('mouseup', () => {
        if (isDragging) {
          isDragging = false;
          zoomWrapper.style.transition = 'transform 0.2s cubic-bezier(0.25, 1, 0.5, 1)';
        }
      });

      // 3. Pantalla completa
      fullscreenBtn.addEventListener('click', () => {
        if (!document.fullscreenElement) {
          document.documentElement.requestFullscreen().catch(err => console.warn(err));
        } else {
          document.exitFullscreen();
        }
      });

      document.addEventListener('fullscreenchange', () => {
        fullscreenBtn.textContent = document.fullscreenElement ? '✕ Salir de pantalla completa' : '⛶ Pantalla completa';
      });
    });
  </script>
</body>
</html>
