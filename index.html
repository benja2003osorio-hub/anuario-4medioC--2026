<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anuario Digital</title>
  <script src="https://cdn.jsdelivr.net/npm/page-flip/dist/js/page-flip.browser.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #121212;
      /* Fondo con textura sutil de mesa de estudio */
      background-image: radial-gradient(circle at 50% 40%, #1e1e1e 0%, #0d0d0d 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: system-ui, -apple-system, sans-serif;
      overflow-x: hidden;
    }

    .flip-container {
      width: 100%;
      max-width: 1200px;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 30px 15px;
      position: relative;
    }

    /* Simulación del lomo y grosor de hojas traseras */
    #book {
      position: relative;
      /* Sombra ambiental profunda + sombras laterales escalonadas que simulan el canto de las hojas */
      box-shadow: 
        0 25px 50px rgba(0, 0, 0, 0.7),
        -6px 0 0 -2px #e5e5e5,
        -7px 0 0 -2px #999999,
        -12px 2px 10px rgba(0, 0, 0, 0.4),
        6px 0 0 -2px #e5e5e5,
        7px 0 0 -2px #999999,
        12px 2px 10px rgba(0, 0, 0, 0.4);
      border-radius: 2px;
    }

    .page {
      background-color: #ffffff;
      overflow: hidden;
      position: relative;
    }

    .page img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      user-select: none;
    }

    /* Sombra del pliegue / lomo interior (gutter shadow) */
    /* Página izquierda: sombra en su borde derecho */
    .page.--left::after {
      content: "";
      position: absolute;
      top: 0;
      right: 0;
      width: 35px;
      height: 100%;
      background: linear-gradient(to left, rgba(0, 0, 0, 0.28) 0%, rgba(0, 0, 0, 0.08) 50%, transparent 100%);
      pointer-events: none;
      z-index: 5;
    }

    /* Página derecha: sombra en su borde izquierdo */
    .page.--right::after {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 35px;
      height: 100%;
      background: linear-gradient(to right, rgba(0, 0, 0, 0.28) 0%, rgba(0, 0, 0, 0.08) 50%, transparent 100%);
      pointer-events: none;
      z-index: 5;
    }

    /* Bisel exterior suave en el borde del papel */
    .page.--left::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 10px;
      height: 100%;
      background: linear-gradient(to right, rgba(0, 0, 0, 0.06), transparent);
      pointer-events: none;
      z-index: 5;
    }

    .page.--right::before {
      content: "";
      position: absolute;
      top: 0;
      right: 0;
      width: 10px;
      height: 100%;
      background: linear-gradient(to left, rgba(0, 0, 0, 0.06), transparent);
      pointer-events: none;
      z-index: 5;
    }

    /* Controles de navegación */
    .controls {
      display: flex;
      gap: 16px;
      margin-top: 20px;
      margin-bottom: 25px;
      align-items: center;
    }
    .btn {
      background-color: #ffffff18;
      color: #ffffff;
      border: 1px solid #ffffff35;
      padding: 10px 22px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      backdrop-filter: blur(8px);
      transition: all 0.2s ease;
    }
    .btn:hover {
      background-color: #ffffff35;
      transform: translateY(-1px);
    }
    .btn:active {
      transform: translateY(0);
    }
    .page-info {
      color: #cccccc;
      font-size: 15px;
      min-width: 130px;
      text-align: center;
      letter-spacing: 0.3px;
    }
  </style>
</head>
<body>

  <div class="flip-container">
    <div id="book"></div>
  </div>

  <div class="controls">
    <button class="btn" id="prevBtn">← Anterior</button>
    <span class="page-info" id="pageNumber">Portada</span>
    <button class="btn" id="nextBtn">Siguiente →</button>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const bookElement = document.getElementById('book');
      
      // Orden exacto de las 36 páginas
      const imageFiles = [
        'Page_0.jpg',
        'Page_0,5.jpg',
        ...Array.from({ length: 32 }, (_, i) => `Page_${String(i + 1).padStart(2, '0')}.jpg`),
        'Page_32,5.jpg',
        'Page_33.jpg'
      ];

      const TOTAL_PAGES = imageFiles.length;

      // Inyección dinámica de las páginas
      imageFiles.forEach((file, index) => {
        const pageDiv = document.createElement('div');
        pageDiv.className = 'page';

        const img = document.createElement('img');
        img.src = file;
        img.alt = `Página ${index + 1}`;
        
        if (index > 3) {
          img.loading = 'lazy';
        }

        pageDiv.appendChild(img);
        bookElement.appendChild(pageDiv);
      });

      // Configuración de StPageFlip con sombras físicas realistas
      const pageFlip = new St.PageFlip(bookElement, {
        width: 550,
        height: 733,
        size: 'stretch',
        minWidth: 315,
        maxWidth: 1000,
        minHeight: 420,
        maxHeight: 1350,
        maxShadowOpacity: 0.85,  // Sombras de curvatura dinámicas bien marcadas
        showCover: true,
        drawShadow: true,
        usePortrait: true,
        mobileScrollSupport: false
      });

      pageFlip.loadFromHTML(document.querySelectorAll('.page'));

      const prevBtn = document.getElementById('prevBtn');
      const nextBtn = document.getElementById('nextBtn');
      const pageInfo = document.getElementById('pageNumber');

      prevBtn.addEventListener('click', () => pageFlip.flipPrev());
      nextBtn.addEventListener('click', () => pageFlip.flipNext());

      pageFlip.on('flip', (e) => {
        const current = e.data;
        if (current === 0) {
          pageInfo.textContent = 'Portada';
        } else if (current >= TOTAL_PAGES - 1) {
          pageInfo.textContent = 'Contraportada';
        } else {
          pageInfo.textContent = `Páginas ${current} - ${current + 1} de ${TOTAL_PAGES}`;
        }
      });
    });
  </script>
</body>
</html>
