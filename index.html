<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anuario Digital</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #121212;
      background-image: radial-gradient(circle at 50% 40%, #1c1c1c 0%, #0d0d0d 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: system-ui, -apple-system, sans-serif;
      overflow-x: hidden;
      user-select: none;
    }

    .stage-container {
      width: 100%;
      max-width: 1300px;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 25px 15px;
      overflow: hidden;
    }

    #zoomWrapper {
      transform-origin: center center;
      transition: transform 0.2s cubic-bezier(0.25, 1, 0.5, 1);
      cursor: default;
    }
    #zoomWrapper.zoomed {
      cursor: grab;
    }
    #zoomWrapper.zoomed:active {
      cursor: grabbing;
    }

    /* Espacio 3D y libro físico */
    .book-viewport {
      perspective: 2400px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .book {
      position: relative;
      width: 480px;
      height: 679px; /* Proporción A4 exacta */
      transform-style: preserve-3d;
      transition: transform 0.8s cubic-bezier(0.25, 1, 0.5, 1), box-shadow 0.4s ease;
      /* Al inicio la portada está centrada */
      transform: translateX(0);
      border-radius: 2px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6);
    }

    /* Cuando el libro está abierto en dos páginas, se desplaza a la derecha y gana volumen lateral */
    .book.is-open {
      transform: translateX(50%);
      box-shadow: 
        0 25px 50px rgba(0, 0, 0, 0.75),
        -6px 0 0 -2px #e5e5e5,
        -7px 0 0 -2px #999999,
        -12px 2px 10px rgba(0, 0, 0, 0.4),
        6px 0 0 -2px #e5e5e5,
        7px 0 0 -2px #999999,
        12px 2px 10px rgba(0, 0, 0, 0.4);
    }

    /* En la contraportada vuelve al centro */
    .book.is-last {
      transform: translateX(100%);
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6);
    }

    /* Hojas individuales con aceleración por GPU */
    .paper {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      transform-origin: left center;
      transform-style: preserve-3d;
      transition: transform 0.8s cubic-bezier(0.25, 1, 0.5, 1);
      will-change: transform;
    }

    .paper.flipped {
      transform: rotateY(-180deg);
    }

    /* Caras frontal y trasera */
    .front, .back {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: #ffffff;
      -webkit-backface-visibility: hidden;
      backface-visibility: hidden;
      overflow: hidden;
      box-shadow: inset 0 0 30px rgba(0,0,0,0.02);
    }

    .back {
      transform: rotateY(180deg);
    }

    .front img, .back img {
      width: 100%;
      height: 100%;
      object-fit: fill;
      display: block;
      pointer-events: none;
    }

    /* Pliegue / Sombra central realista en CSS puro */
    .front::after {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 30px;
      height: 100%;
      background: linear-gradient(to right, rgba(0,0,0,0.22) 0%, rgba(0,0,0,0.02) 60%, transparent 100%);
      pointer-events: none;
    }

    .back::after {
      content: "";
      position: absolute;
      top: 0;
      right: 0;
      width: 30px;
      height: 100%;
      background: linear-gradient(to left, rgba(0,0,0,0.22) 0%, rgba(0,0,0,0.02) 60%, transparent 100%);
      pointer-events: none;
    }

    /* La portada y contraportada no llevan sombra interior */
    .paper:first-child .front::after,
    .paper:last-child .back::after {
      display: none;
    }

    /* Controles de navegación */
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 15px;
      margin-bottom: 20px;
      align-items: center;
      justify-content: center;
      z-index: 10;
    }

    .btn-group {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .btn {
      background-color: #ffffff18;
      color: #ffffff;
      border: 1px solid #ffffff35;
      padding: 9px 18px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      backdrop-filter: blur(8px);
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .btn:hover {
      background-color: #ffffff35;
      transform: translateY(-1px);
    }
    .btn:active {
      transform: translateY(0);
    }
    .btn-icon {
      padding: 9px 14px;
      font-size: 16px;
    }

    .page-info {
      color: #cccccc;
      font-size: 15px;
      min-width: 140px;
      text-align: center;
      letter-spacing: 0.3px;
    }
  </style>
</head>
<body>

  <div class="stage-container">
    <div id="zoomWrapper">
      <div class="book-viewport">
        <div class="book" id="book"></div>
      </div>
    </div>
  </div>

  <div class="controls">
    <div class="btn-group">
      <button class="btn" id="prevBtn" title="Flecha izquierda (←)">← Anterior</button>
      <span class="page-info" id="pageNumber">Portada</span>
      <button class="btn" id="nextBtn" title="Flecha derecha (→)">Siguiente →</button>
    </div>

    <div class="btn-group">
      <button class="btn btn-icon" id="zoomOutBtn" title="Alejar zoom">−</button>
      <button class="btn btn-icon" id="zoomResetBtn" title="Restablecer zoom">100%</button>
      <button class="btn btn-icon" id="zoomInBtn" title="Acercar zoom">+</button>
    </div>

    <button class="btn" id="fullscreenBtn">⛶ Pantalla completa</button>
  </div>
