<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anuario Digital</title>
  <script src="https://cdn.jsdelivr.net/npm/page-flip/dist/js/page-flip.browser.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #121212;
      background-image: radial-gradient(circle at 50% 40%, #1e1e1e 0%, #0d0d0d 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: system-ui, -apple-system, sans-serif;
      overflow-x: hidden;
    }

    .flip-container {
      width: 100%;
      max-width: 1200px;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px 15px;
      position: relative;
    }

    /* Simulación de volumen y cantos de hojas */
    #book {
      position: relative;
      box-shadow: 
        0 25px 50px rgba(0, 0, 0, 0.7),
        -6px 0 0 -2px #e5e5e5,
        -7px 0 0 -2px #999999,
        -12px 2px 10px rgba(0, 0, 0, 0.4),
        6px 0 0 -2px #e5e5e5,
        7px 0 0 -2px #999999,
        12px 2px 10px rgba(0, 0, 0, 0.4);
      border-radius: 2px;
    }

    .page {
      background-color: #ffffff;
      overflow: hidden;
      position: relative;
    }

    .page img {
      width: 100%;
      height: 100%;
      object-fit: fill;
      display: block;
      user-select: none;
    }

    /* Sombra del pliegue central */
    .page.--left::after {
      content: "";
      position: absolute;
      top: 0;
      right: 0;
      width: 32px;
      height: 100%;
      background: linear-gradient(to left, rgba(0, 0, 0, 0.28) 0%, rgba(0, 0, 0, 0.08) 50%, transparent 100%);
      pointer-events: none;
      z-index: 5;
    }

    .page.--right::after {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 32px;
      height: 100%;
      background: linear-gradient(to right, rgba(0, 0, 0, 0.28) 0%, rgba(0, 0, 0, 0.08) 50%, transparent 100%);
      pointer-events: none;
      z-index: 5;
    }

    /* Bisel exterior */
    .page.--left::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 10px;
      height: 100%;
      background: linear-gradient(to right, rgba(0, 0, 0, 0.05), transparent);
      pointer-events: none;
      z-index: 5;
    }

    .page.--right::before {
      content: "";
      position: absolute;
      top: 0;
      right: 0;
      width: 10px;
      height: 100%;
      background: linear-gradient(to left, rgba(0, 0, 0, 0.05), transparent);
      pointer-events: none;
      z-index: 5;
    }

    /* Barra de controles */
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      margin-top: 15px;
      margin-bottom: 20px;
      align-items: center;
      justify-content: center;
    }
    .btn {
      background-color: #ffffff18;
      color: #ffffff;
      border: 1px solid #ffffff35;
      padding: 9px 18px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      backdrop-filter: blur(8px);
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .btn:hover {
      background-color: #ffffff35;
      transform: translateY(-1px);
    }
    .btn:active {
      transform: translateY(0);
    }
    .page-info {
      color: #cccccc;
      font-size: 15px;
      min-width: 130px;
      text-align: center;
      letter-spacing: 0.3px;
    }
  </style>
</head>
<body>

  <div class="flip-container">
    <div id="book"></div>
  </div>

  <div class="controls">
    <button class="btn" id="prevBtn">← Anterior</button>
    <span class="page-info" id="pageNumber">Portada</span>
    <button class="btn" id="nextBtn">Siguiente →</button>
    <button class="btn" id="fullscreenBtn">⛶ Pantalla completa</button>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const bookElement = document.getElementById('book');
      
      const imageFiles = [
        'Page_0.jpg',
        'Page_0,5.jpg',
        ...Array.from({ length: 32 }, (_, i) => `Page_${String(i + 1).padStart(2, '0')}.jpg`),
        'Page_32,5.jpg',
        'Page_33.jpg'
      ];

      const TOTAL_PAGES = imageFiles.length;

      // Inyección con prioridad de renderizado (sin lazy load bloqueante)
      imageFiles.forEach((file, index) => {
        const pageDiv = document.createElement('div');
        pageDiv.className = 'page';

        const img = document.createElement('img');
        img.src = file;
        img.alt = `Página ${index + 1}`;
        
        // Las primeras 6 páginas se decodifican de inmediato en sincronía
        if (index < 6) {
          img.decoding = 'sync';
          img.fetchPriority = 'high';
        } else {
          img.decoding = 'async';
        }

        pageDiv.appendChild(img);
        bookElement.appendChild(pageDiv);
      });

      // Configuración A4 a 300 ppp
      const pageFlip = new St.PageFlip(bookElement, {
        width: 500,
        height: 707,
        size: 'stretch',
        minWidth: 310,
        maxWidth: 1100,
        minHeight: 438,
        maxHeight: 1555,
        maxShadowOpacity: 0.85,
        showCover: true,
        drawShadow: true,
        usePortrait: true,
        mobileScrollSupport: false
      });

      pageFlip.loadFromHTML(document.querySelectorAll('.page'));

      // Precarga agresiva en segundo plano de las 36 imágenes
      const preloadImagesInBackground = () => {
        let cursor = 0;
        const loadNextBatch = () => {
          if (cursor >= imageFiles.length) return;
          const preImg = new Image();
          preImg.src = imageFiles[cursor];
          preImg.onload = preImg.onerror = () => {
            cursor++;
            // Usa el tiempo ocioso del navegador para no congelar la animación
            if ('requestIdleCallback' in window) {
              requestIdleCallback(loadNextBatch, { timeout: 150 });
            } else {
              setTimeout(loadNextBatch, 40);
            }
          };
        };
        loadNextBatch();
      };

      // Inicia la precarga silenciosa en segundo plano apenas arranca el libro
      preloadImagesInBackground();

      const prevBtn = document.getElementById('prevBtn');
      const nextBtn = document.getElementById('nextBtn');
      const pageInfo = document.getElementById('pageNumber');
      const fullscreenBtn = document.getElementById('fullscreenBtn');

      prevBtn.addEventListener('click', () => pageFlip.flipPrev());
      nextBtn.addEventListener('click', () => pageFlip.flipNext());

      pageFlip.on('flip', (e) => {
        const current = e.data;
        if (current === 0) {
          pageInfo.textContent = 'Portada';
        } else if (current >= TOTAL_PAGES - 1) {
          pageInfo.textContent = 'Contraportada';
        } else {
          pageInfo.textContent = `Páginas ${current} - ${current + 1} de ${TOTAL_PAGES}`;
        }
      });

      // Pantalla completa
      fullscreenBtn.addEventListener('click', () => {
        if (!document.fullscreenElement) {
          document.documentElement.requestFullscreen().catch(err => {
            console.warn(`Error al activar pantalla completa: ${err.message}`);
          });
        } else {
          document.exitFullscreen();
        }
      });

      document.addEventListener('fullscreenchange', () => {
        if (document.fullscreenElement) {
          fullscreenBtn.textContent = '✕ Salir de pantalla completa';
        } else {
          fullscreenBtn.textContent = '⛶ Pantalla completa';
        }
      });
    });
  </script>
</body>
</html>
